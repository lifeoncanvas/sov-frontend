<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#211C18"/>
      <stop offset="100%" stop-color="#14100E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E3C6"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA8232"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>

  <!-- Luxury Borders -->
  <rect x="36" y="36" width="728" height="928" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.35"/>
  <rect x="44" y="44" width="712" height="912" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.2"/>

  <!-- Decorative Corner Accents -->
  <path d="M 54 64 L 64 64 L 64 54" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
  <path d="M 746 64 L 736 64 L 736 54" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
  <path d="M 54 936 L 64 936 L 64 946" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
  <path d="M 746 936 L 736 936 L 736 946" fill="none" stroke="url(#gold)" stroke-width="1.5"/>

  <!-- Center Artwork / Illustration -->
  <g filter="url(#shadow)" transform="translate(400, 460)">
    
      <!-- Oak Frame -->
      <rect x="-120" y="-80" width="240" height="260" rx="4" fill="#755238" stroke="url(#gold)" stroke-width="3"/>
      <rect x="-95" y="-55" width="190" height="210" fill="#EDE6DC" stroke="url(#gold)" stroke-width="1"/>
      <!-- Float Glass & Pressed Flower -->
      <path d="M 0,90 Q 5,10 0,-20" stroke="#8A7356" stroke-width="3" fill="none"/>
      <circle cx="0" cy="-20" r="16" fill="url(#gold)"/>
      <ellipse cx="-20" cy="-20" rx="14" ry="8" fill="#C5A880"/>
      <ellipse cx="20" cy="-20" rx="14" ry="8" fill="#C5A880"/>
      <ellipse cx="0" cy="-40" rx="8" ry="14" fill="#C5A880"/>
      <ellipse cx="0" cy="0" rx="8" ry="14" fill="#C5A880"/>
    
  </g>

  <!-- Title & Branding -->
  <g transform="translate(400, 750)">
    <text text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="600" fill="url(#gold)" letter-spacing="3">PRESSED BLOOM</text>
    <text y="36" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="400" fill="#F5F2EB" letter-spacing="4" opacity="0.85">OAK FLOAT FRAME</text>
    <line x1="-60" y1="62" x2="60" y2="62" stroke="url(#gold)" stroke-width="1" opacity="0.6"/>
    <text y="92" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#C5A880" letter-spacing="3" opacity="0.85">LICHT SIGNATURE SOUVENIRS</text>
  </g>
</svg>