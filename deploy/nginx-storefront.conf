# nginx site for LICHT Signature Souvenirs on ONE domain:
#   https://lichtsignaturesouvenirs.store            -> the storefront (built `dist/` folder)
#   https://lichtsignaturesouvenirs.store/api/...    -> the LICHT backend (souv-b) running on this server
#   https://lichtsignaturesouvenirs.store/uploads/... -> customer logo uploads, served by the same backend
#
# Install (as root), with DNS "A" records for lichtsignaturesouvenirs.store and www pointing at this server:
#   mkdir -p /var/www/licht && cp -r dist/* /var/www/licht/
#   cp deploy/nginx-storefront.conf /etc/nginx/sites-available/licht-storefront
#   ln -s /etc/nginx/sites-available/licht-storefront /etc/nginx/sites-enabled/
#   Remove any OTHER enabled site that also uses "server_name lichtsignaturesouvenirs.store"
#   (grep -rl lichtsignaturesouvenirs /etc/nginx/sites-enabled/), otherwise nginx picks one of them at random.
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d lichtsignaturesouvenirs.store -d www.lichtsignaturesouvenirs.store

# The LICHT backend (souv-b). It listens on 8090 by default; if another app already uses 8090 on this server,
# start LICHT with PORT=8091 in /etc/licht/api.env and change the port here to match.
upstream licht_api {
    server 127.0.0.1:8090;
    keepalive 8;
}

server {
    listen 80;
    server_name lichtsignaturesouvenirs.store www.lichtsignaturesouvenirs.store;

    root /var/www/licht;
    index index.html;

    # Customer logo uploads go through /api; matches the backend's 40MB request limit.
    client_max_body_size 40m;

    # Same headers as public/_headers (which only Netlify/Cloudflare read). The Content-Security-Policy itself is
    # a <meta> tag in index.html, added at build time.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://www.paypal.com\")" always;

    # --- Backend: the API, uploaded files and the sitemap come from the LICHT backend. ---
    location /api/ {
        proxy_pass http://licht_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://licht_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://licht_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Storefront ---
    # Built files have a content hash in their name, so they can be cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Single-page app: every other path (/shop, /product/...) is handled by index.html, which must not be cached
    # so a new release is picked up immediately.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://www.paypal.com\")" always;
    }
}
