# nginx site for the storefront: https://lichtsignaturesouvenirs.store (and www) serving the built `dist/` folder.
#
# Install (as root), after pointing DNS "A" records for lichtsignaturesouvenirs.store and www at this server:
#   mkdir -p /var/www/licht && cp -r dist/* /var/www/licht/
#   cp deploy/nginx-storefront.conf /etc/nginx/sites-available/licht-storefront
#   ln -s /etc/nginx/sites-available/licht-storefront /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d lichtsignaturesouvenirs.store -d www.lichtsignaturesouvenirs.store

server {
    listen 80;
    server_name lichtsignaturesouvenirs.store www.lichtsignaturesouvenirs.store;

    root /var/www/licht;
    index index.html;

    # Same headers as public/_headers (which only Netlify/Cloudflare read). The Content-Security-Policy itself is
    # a <meta> tag in index.html, added at build time.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://www.paypal.com\")" always;

    # Built files have a content hash in their name, so they can be cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The sitemap is generated by the API from the live catalogue.
    location = /sitemap.xml {
        proxy_pass https://api.lichtsignaturesouvenirs.store/sitemap.xml;
        proxy_ssl_server_name on;
        proxy_set_header Host api.lichtsignaturesouvenirs.store;
    }

    # Single-page app: every other path (/shop, /product/...) is handled by index.html, which must not be cached
    # so a new release is picked up immediately.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://www.paypal.com\")" always;
    }
}
